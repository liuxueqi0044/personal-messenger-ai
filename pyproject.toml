[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-messenger-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "httpx>=0.27", "beautifulsoup4>=4.12"]
llm = ["openai>=1.0"]
web = ["starlette>=0.37", "uvicorn>=0.29", "httpx>=0.27"]
mcp = ["mcp>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
